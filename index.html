<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="小さな Web ツールを集めた fld。めしガチャなどのユーティリティへすぐアクセスできます。"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>fld — 小さなツール集</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
    <style>
      :root {
        --md-sys-color-primary: #006875;
        --md-sys-color-on-primary: #ffffff;
        --md-sys-color-primary-container: #9eeffd;
        --md-sys-color-on-primary-container: #001f24;
        --md-sys-color-secondary: #4a6267;
        --md-sys-color-on-secondary: #ffffff;
        --md-sys-color-secondary-container: #cde7ec;
        --md-sys-color-on-secondary-container: #051f23;
        --md-sys-color-surface: #fbfcfd;
        --md-sys-color-surface-dim: #d8dadc;
        --md-sys-color-surface-bright: #fbfcfd;
        --md-sys-color-surface-container-lowest: #ffffff;
        --md-sys-color-surface-container-low: #f2f4f5;
        --md-sys-color-surface-container: #eceeef;
        --md-sys-color-surface-container-high: #e6e8e9;
        --md-sys-color-surface-container-highest: #e0e3e4;
        --md-sys-color-on-surface: #191c1d;
        --md-sys-color-on-surface-variant: #3f484a;
        --md-sys-color-outline: #6f797b;
        --md-sys-color-outline-variant: #bfc8ca;
        --md-elevation-1: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 3px 1px rgba(0, 0, 0, 0.15);
        --md-elevation-2: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 6px 2px rgba(0, 0, 0, 0.15);
        --md-elevation-3: 0 4px 8px 3px rgba(0, 0, 0, 0.15), 0 1px 3px rgba(0, 0, 0, 0.3);
        --md-shape-corner-medium: 12px;
        --md-shape-corner-large: 16px;
        --md-shape-corner-extra-large: 28px;
        --font-sans: "Roboto", "Roboto Flex", sans-serif;
        --ease-emphasized: cubic-bezier(0.2, 0, 0, 1);
        --ease-standard: cubic-bezier(0.2, 0, 0, 1);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        font-family: var(--font-sans);
        color: var(--md-sys-color-on-surface);
        background:
          radial-gradient(ellipse 90% 55% at 0% 0%, rgba(0, 104, 117, 0.08), transparent 55%),
          radial-gradient(ellipse 70% 45% at 100% 0%, rgba(158, 239, 253, 0.35), transparent 50%),
          linear-gradient(180deg, #ffffff 0%, var(--md-sys-color-surface) 40%, #f0f5f6 100%);
        -webkit-font-smoothing: antialiased;
      }

      .top-app-bar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        min-height: 64px;
        padding: 0 1.25rem;
        background: color-mix(in srgb, var(--md-sys-color-surface-container-lowest) 88%, transparent);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 40%, transparent);
      }

      .top-app-bar__logo {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: var(--md-sys-color-primary);
        color: var(--md-sys-color-on-primary);
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .top-app-bar__title {
        margin: 0;
        font-size: 1.375rem;
        font-weight: 500;
        letter-spacing: 0;
        color: var(--md-sys-color-on-surface);
      }

      .page {
        width: min(720px, calc(100% - 2rem));
        margin: 0 auto;
        padding: clamp(2.5rem, 8vh, 4.5rem) 0 3.5rem;
      }

      .hero {
        margin-bottom: 2.5rem;
        animation: md-enter 500ms var(--ease-emphasized) both;
      }

      .brand {
        margin: 0 0 0.75rem;
        font-family: "Roboto Flex", var(--font-sans);
        font-size: clamp(4rem, 14vw, 5.75rem);
        font-weight: 700;
        font-optical-sizing: auto;
        line-height: 0.95;
        letter-spacing: -0.04em;
        color: var(--md-sys-color-on-surface);
      }

      .brand span {
        color: var(--md-sys-color-primary);
      }

      .lede {
        margin: 0;
        max-width: 28rem;
        color: var(--md-sys-color-on-surface-variant);
        font-size: 1.05rem;
        font-weight: 400;
        line-height: 1.55;
        letter-spacing: 0.01em;
      }

      .section-label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0 0 1rem;
        color: var(--md-sys-color-on-surface-variant);
        font-size: 0.875rem;
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        animation: md-enter 500ms var(--ease-emphasized) 0.08s both;
      }

      .section-label .material-symbols-outlined {
        font-size: 1.15rem;
        color: var(--md-sys-color-primary);
      }

      .tools {
        display: grid;
        gap: 1rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .tool {
        animation: md-enter 500ms var(--ease-emphasized) both;
      }

      .tool:nth-child(1) {
        animation-delay: 0.14s;
      }

      .tool a {
        position: relative;
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 1rem;
        align-items: center;
        overflow: hidden;
        padding: 1.25rem 1.25rem 1.25rem 1.15rem;
        color: inherit;
        text-decoration: none;
        background: var(--md-sys-color-surface-container-lowest);
        border: 1px solid color-mix(in srgb, var(--md-sys-color-outline-variant) 55%, transparent);
        border-radius: var(--md-shape-corner-large);
        box-shadow: var(--md-elevation-1);
        transition:
          box-shadow 200ms var(--ease-standard),
          transform 200ms var(--ease-standard),
          border-color 200ms var(--ease-standard),
          background-color 200ms var(--ease-standard);
      }

      .tool a::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at var(--ripple-x, 50%) var(--ripple-y, 50%), rgba(0, 104, 117, 0.12), transparent 55%);
        opacity: 0;
        transition: opacity 280ms var(--ease-standard);
        pointer-events: none;
      }

      .tool a:hover,
      .tool a:focus-visible {
        background: var(--md-sys-color-surface-container-low);
        border-color: color-mix(in srgb, var(--md-sys-color-primary) 35%, var(--md-sys-color-outline-variant));
        box-shadow: var(--md-elevation-2);
        transform: translateY(-1px);
        outline: none;
      }

      .tool a:hover::before,
      .tool a:focus-visible::before {
        opacity: 1;
      }

      .tool a:focus-visible {
        outline: 2px solid var(--md-sys-color-primary);
        outline-offset: 2px;
      }

      .tool__icon {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: var(--md-shape-corner-medium);
        background: var(--md-sys-color-primary-container);
        color: var(--md-sys-color-on-primary-container);
      }

      .tool__icon .material-symbols-outlined {
        font-size: 1.5rem;
      }

      .tool__body {
        min-width: 0;
      }

      .tool__name {
        margin: 0 0 0.2rem;
        font-size: 1.125rem;
        font-weight: 500;
        letter-spacing: 0.01em;
        color: var(--md-sys-color-on-surface);
      }

      .tool__desc {
        margin: 0;
        color: var(--md-sys-color-on-surface-variant);
        font-size: 0.875rem;
        line-height: 1.45;
        letter-spacing: 0.015em;
      }

      .tool__arrow {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: var(--md-sys-color-primary);
        color: var(--md-sys-color-on-primary);
        box-shadow: var(--md-elevation-1);
        transition: transform 200ms var(--ease-standard), box-shadow 200ms var(--ease-standard);
      }

      .tool__arrow .material-symbols-outlined {
        font-size: 1.25rem;
      }

      .tool a:hover .tool__arrow,
      .tool a:focus-visible .tool__arrow {
        transform: translateX(3px);
        box-shadow: var(--md-elevation-2);
      }

      .foot {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 2.75rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--md-sys-color-outline-variant);
        color: var(--md-sys-color-on-surface-variant);
        font-size: 0.8125rem;
        letter-spacing: 0.02em;
        animation: md-enter 500ms var(--ease-emphasized) 0.28s both;
      }

      .foot .material-symbols-outlined {
        font-size: 1.1rem;
        color: var(--md-sys-color-outline);
      }

      .foot a {
        color: var(--md-sys-color-primary);
        font-weight: 500;
        text-decoration: none;
      }

      .foot a:hover,
      .foot a:focus-visible {
        text-decoration: underline;
        text-underline-offset: 0.2em;
        outline: none;
      }

      @keyframes md-enter {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 480px) {
        .tool a {
          grid-template-columns: auto 1fr;
          gap: 0.85rem;
        }

        .tool__arrow {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="top-app-bar">
      <div class="top-app-bar__logo" aria-hidden="true">fl</div>
      <p class="top-app-bar__title">fld</p>
    </header>

    <main class="page">
      <section class="hero">
        <h1 class="brand">fl<span>d</span></h1>
        <p class="lede">小さな Web ツールをまとめたページです。使いたいものを選んでください。</p>
      </section>

      <p class="section-label">
        <span class="material-symbols-outlined" aria-hidden="true">widgets</span>
        Tools
      </p>
      <ul class="tools">
        <li class="tool">
          <a href="meshigacha/">
            <span class="tool__icon" aria-hidden="true">
              <span class="material-symbols-outlined">restaurant</span>
            </span>
            <span class="tool__body">
              <h2 class="tool__name">めしガチャ</h2>
              <p class="tool__desc">現在地の近くから、今日のごはんをランダムに決めます。</p>
            </span>
            <span class="tool__arrow" aria-hidden="true">
              <span class="material-symbols-outlined">arrow_forward</span>
            </span>
          </a>
        </li>
      </ul>

      <p class="foot">
        <span class="material-symbols-outlined" aria-hidden="true">code</span>
        GitHub:
        <a href="https://github.com/d1y1/fld" rel="noopener noreferrer">d1y1/fld</a>
      </p>
    </main>
  </body>
</html>
